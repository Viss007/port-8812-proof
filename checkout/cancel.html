<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout cancelled — Port 8812</title>
<style>
:root{--b:#09080d;--p:#5cebff;--t:#f8f3fb;--m:#aaa1b1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 18px;background:var(--b);color:var(--t);font-family:Inter,system-ui,sans-serif}
.card{width:min(560px,100%);border:1px solid #5cebff33;border-radius:18px;padding:28px 24px;background:#0d0c1170}
h1{margin:0;font-size:clamp(28px,5vw,40px);letter-spacing:-.04em}
.p{color:var(--m);line-height:1.5;margin:14px 0 0;font-size:16px}
.btn{display:inline-flex;margin-top:22px;padding:14px 18px;border-radius:12px;background:var(--p);color:#0b0710;font-weight:900;text-decoration:none}
</style>
</head>
<body>
<main class="card">
<h1>Payment not completed</h1>
<p class="p">Checkout was cancelled or interrupted. No charge from this attempt. You can try again whenever you want.</p>
<a class="btn" href="https://github.com/Viss007/port-8812-proof/tree/main/proof">Open public proof</a>
</main>
</body>
</html>
